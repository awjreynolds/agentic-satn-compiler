# Closed GDAL OSM mapping for the governed raw-network adapter.  It retains
# full way tags in other_tags (including ele) while preserving the standard
# OGR lines schema.
[general]
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,shop,sport,tourism,highway=platform,public_transport=platform
# Keep tags available to the OGR lines layer; the intentionally short ignore
# list below controls only fields SATN cannot use as governed network evidence.

[lines]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,highway,waterway,aerialway,barrier,man_made,railway
ignore=created_by,converted_by,source,time,note,todo,openGeoDB:,fixme,FIXME

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: "0.11.32"
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: uv export --frozen --group audit --no-emit-project --output-file .audit-requirements.txt
      - run: uv run pip-audit -r .audit-requirements.txt --strict
      - run: uv run ruff check .
      - run: uv run ty check src/
      - run: >-
          uv run prek run
          check-yaml check-toml check-merge-conflict
          detect-secrets actionlint zizmor shellcheck
          --all-files
      # One complete synthetic Scenario Compilation is the routine
      # Parallel-Reduction proving gate. Expected results are read-only here.
      - run: uv run pytest tests/test_parallel_reduction_corpus.py
      # Routine regression is fixture-only; the explicit WECA compiler benchmark
      # is a manual governed release gate and must never run in CI.
      - run: >-
          uv run pytest
          --cov=satn --cov=lcwip
          --cov-report=term-missing
          --cov-report=xml
      - run: uv run playwright install chromium
      - run: uv run pytest --browser -m browser tests/test_review_map_browser.py
      - run: uv build --no-sources

  portable-network-identifiers:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: "0.11.32"
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: >-
          uv run pytest
          tests/test_content_identity.py
          tests/test_backbone_assembly.py::test_cross_platform_identifier_and_provenance_fixture_is_exact

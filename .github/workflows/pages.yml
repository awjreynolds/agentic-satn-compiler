name: Deploy generated SATN release

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag containing satn-pages.zip
        required: true
        type: string

jobs:
  verify-release:
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify the selected release is published
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          release="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,publishedAt,tagName)"
          jq --exit-status --arg release_tag "$RELEASE_TAG" \
            '.tagName == $release_tag and .isDraft == false and .isPrerelease == false and (.publishedAt | type == "string")' \
            <<<"$release" >/dev/null
          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  validate-release:
    needs: verify-release
    permissions:
      contents: read
    outputs:
      release_tag: ${{ needs.verify-release.outputs.release_tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tracked release catalogue and Area Definitions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.verify-release.outputs.release_tag }}
          persist-credentials: false
      - name: Download generated Pages release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-release.outputs.release_tag }}
        run: >-
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          --pattern satn-pages.zip --dir release
      - name: Extract generated Pages release artifact
        run: unzip -q release/satn-pages.zip -d pages
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          version: "0.11.32"
      - run: uv python install 3.12
      - name: Install packaged-map rendering validator
        run: uv sync --frozen --only-group test --no-install-project
      - name: Install Chromium for packaged-map validation
        run: uv run --no-sync playwright install chromium
      - name: Validate every packaged strategic network renders
        run: uv run --no-sync python scripts/validate_pages_rendering.py pages
      - name: Upload validated Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-pages-${{ needs.verify-release.outputs.release_tag }}
          path: pages
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: validate-release
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download validated Pages artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-pages-${{ needs.validate-release.outputs.release_tag }}
          path: pages
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Archive Pages artifact
        shell: sh
        env:
          INPUT_PATH: pages
        run: >-
          tar --dereference --hard-dereference
          --directory "$INPUT_PATH"
          -cvf "$RUNNER_TEMP/artifact.tar"
          --exclude=.git
          --exclude=.github
          .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  cleanup-release-archive:
    needs: [verify-release, deploy]
    if: ${{ always() && needs.deploy.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary release archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-release.outputs.release_tag }}
        run: >-
          gh release delete-asset "$RELEASE_TAG" satn-pages.zip
          --repo "$GITHUB_REPOSITORY" --yes

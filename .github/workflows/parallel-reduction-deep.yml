name: Parallel-Reduction deep corpus

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/parallel-reduction-deep.yml"
      - "src/satn/parallel_reduction.py"
      - "src/satn/parallel_reduction_corpus.py"
      - "src/satn/parallel_reduction_evidence.py"
      - "src/satn/parallel_reduction_scope.py"
      - "src/satn/section_population.py"
      - "src/satn/topography.py"
      - "tests/test_parallel_reduction_engine.py"
      - "tests/test_parallel_reduction_corpus.py"
      - "data/corpus/parallel-reduction/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/parallel-reduction-deep.yml"
      - "src/satn/parallel_reduction.py"
      - "src/satn/parallel_reduction_corpus.py"
      - "src/satn/parallel_reduction_evidence.py"
      - "src/satn/parallel_reduction_scope.py"
      - "src/satn/section_population.py"
      - "src/satn/topography.py"
      - "tests/test_parallel_reduction_engine.py"
      - "tests/test_parallel_reduction_corpus.py"
      - "data/corpus/parallel-reduction/**"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deep-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: uv run pytest tests/test_parallel_reduction_corpus.py --parallel-reduction-deep

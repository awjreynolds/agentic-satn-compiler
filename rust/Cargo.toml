[package]
name = "satn-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = "2"
geo = { version = "0.33", default-features = false }
# Build bundled GEOS statically for exact line noding and polygonization.
geos = { version = "=11.2.2", features = ["static", "v3_10_0"] }
proj4rs = { version = "0.2", default-features = false }
rstar = "0.13"

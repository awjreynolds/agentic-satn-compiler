name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      # Routine regression is fixture-only; the explicit WECA compiler benchmark
      # is a manual governed release gate and must never run in CI.
      - run: uv run pytest
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest --browser -m browser tests/test_review_map_browser.py
      - run: uv build

  portable-network-identifiers:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: >-
          uv run pytest
          tests/test_content_identity.py
          tests/test_backbone_assembly.py::test_cross_platform_identifier_and_provenance_fixture_is_exact

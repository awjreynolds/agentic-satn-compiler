# Governed B&NES Area Definition. Outputs are reproducible process artifacts,
# deliberately kept below ignored build/ rather than committed to Git.
area_id: bath-and-north-east-somerset
area_name: Bath and North East Somerset
deployment_id: banes
source:
  kind: osm
  osm_place_query: Bath and North East Somerset, England, United Kingdom
  ncn_feature_service_url: https://services5.arcgis.com/1ZHcUS1lwPTg4ms0/arcgis/rest/services/National_Cycle_Network_Public/FeatureServer
  reclassified_ncn_feature_service_url: https://services5.arcgis.com/1ZHcUS1lwPTg4ms0/arcgis/rest/services/Reclassified_Routes_Public/FeatureServer
  snapshot_dir: ../../data/snapshots
  # Preserve the historical core while deliberately migrating official-road
  # evidence to the v1-compatible WECA Source Export under ADR 0017.
  snapshot_id: banes-osm-open-roads-v1-2026-07-29
  retained_core_source:
    snapshot_id: banes-osm-current
    manifest_sha256: d54cd57ff2b1a92fab0b48a8b616cc4bcb8721b274024880d4ccc17b9a486c39
  network_type: bike
  overpass_url: https://overpass-api.de/api
  osm_timeout_seconds: 600
  external_buffer_km: 15
  internal_portal_threshold_km: 1
  community_place_types: [town, village, suburb, quarter, neighbourhood]
  urban_place_types: [city, town, suburb, quarter, neighbourhood]
  urban_scope_buffer_km: 2
  official_road_classification:
    path: ../../data/governed/weca-os-open-roads-2026-04-07.geojson
    source_id: os-open-roads-2026-04-07
    effective_date: 2026-04-07
    licence: Open Government Licence v3.0
  national_elevation:
    provider: local-geojson
    path: ../../data/local/ea-lidar-dtm-1m-banes-samples.geojson
    source_id: ea-lidar-composite-dtm-1m
    effective_date: 2023-02-08
    licence: Open Government Licence v3.0
    attribution: "© Environment Agency copyright and/or database right 2022."
    elevation_field: elevation_m
    identifier_field: evidence_id
compilation:
  max_connection_km: 15
  criteria_version: "1"
  agent:
    provider: fake
    response_mode: direct-runtime
    review_statuses: [amber, red]
  network_selection:
    profile_id: banes-network-selection-v1
    candidate_source_precedence:
      - verified-existing-asset
      - a-road-corridor
      - b-road-corridor
      - other-routable
atm:
  enabled: false
  mode: blind
  path: ../../data/local/banes-atm-full.geojson
  redistribution_permitted: false
publication:
  output_dir: ../../build/compiled/banes
  comparison_reference: ../../references/banes-legacy-pairwise-summary.json
  title: B&NES Strategic Active Travel Network Review
  pdf_page_size: A3
  audience: public

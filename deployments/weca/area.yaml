  snapshot_dir: ../../data/snapshots
  # Recovery starts from the immutable v10 benchmark and promotes a new
  # bounded fixed-point chain without mutating that historical core.
  snapshot_id: "weca-classification-elevation-2026-07-31-v14-fp-20260731T092920522968Z-02"
  retained_core_source:
    snapshot_id: "weca-classification-elevation-2026-07-31-v14-fp-20260731T092920522968Z-01"
    manifest_sha256: "ae3bdee90d03ceb2c3be309847c65d7ca29fe82d92767d115903b593d081ebb9"
  network_type: bike
  overpass_url: https://overpass-api.de/api
  osm_timeout_seconds: 600
  external_buffer_km: 15
  internal_portal_threshold_km: 1
  community_place_types: [town, village, suburb, quarter, neighbourhood]
  urban_place_types: [city, town, suburb, quarter, neighbourhood]
  urban_scope_buffer_km: 2
  official_road_classification:
    path: ../../data/governed/weca-os-open-roads-2026-04-07.geojson
    source_id: os-open-roads-2026-04-07
    effective_date: 2026-04-07
    licence: Open Government Licence v3.0
  national_elevation:
    provider: local-geojson
    path: "../../data/local/ea-lidar-dtm-1m-weca-recovery-v14.fixed-point-0879f68f5d1d918cf54ed80c91c425768e95deca450ca0227582b6a2511cc216.geojson"
    source_id: ea-lidar-composite-dtm-1m

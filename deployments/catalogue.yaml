schema_version: satn-deployment-catalogue/v1
title: Agentic SATN Compiler deployments
# deployment_id is the stable published identity and Pages path. The referenced
# Area Definition supplies the geographical area_id written to publication.json.
deployments:
  - deployment_id: weca
    area_id: west-of-england
    area_name: West of England Combined Authority area
    area_definition: weca/area.yaml
    deployment_path: deployments/weca/
    artifacts:
      review_map: index.html
      network_map_pdf: network-map.pdf
      review_map_zip: review-map.zip
  - deployment_id: wiltshire
    area_id: wiltshire
    area_name: Wiltshire Council
    area_definition: wiltshire/area.yaml
    deployment_path: deployments/wiltshire/
    artifacts:
      review_map: index.html
      network_map_pdf: network-map.pdf
      review_map_zip: review-map.zip
  - deployment_id: wmca
    area_id: west-midlands-combined-authority
    area_name: West Midlands Combined Authority constituent area
    area_definition: wmca/area.yaml
    deployment_path: deployments/wmca/
    artifacts:
      review_map: index.html
      network_map_pdf: network-map.pdf
      review_map_zip: review-map.zip

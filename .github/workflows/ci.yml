name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.11.32"
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: uv export --frozen --group audit --no-emit-project --output-file .audit-requirements.txt
      - run: uv run pip-audit -r .audit-requirements.txt --strict
      - run: uv run ruff check .
      - run: uv run ty check src/
      - run: >-
          uv run prek run
          check-yaml check-toml check-merge-conflict
          actionlint zizmor shellcheck
          --all-files
      # One complete synthetic Scenario Compilation is the routine
      # Parallel-Reduction proving gate. Expected results are read-only here.
      - run: uv run pytest tests/test_parallel_reduction_corpus.py
      # Exercise the OSM-admission and POC-publication surfaces changed by this
      # release. The complete WECA compilation remains an explicit release step.
      - run: >-
          uv run pytest
          tests/test_agent_decision_replay.py
          tests/test_area_deployment_browser.py
          tests/test_asset_accounting_contract.py
          tests/test_compilation_dependencies.py
          tests/test_compilation_metadata.py
          tests/test_context_evidence.py
          tests/test_ea_fixed_point_convergence.py
          tests/test_elevation_sources.py
          tests/test_osm_network_adapter.py
          tests/test_osm_sources.py
          tests/test_pages_packaging.py
          tests/test_published_site.py
          tests/test_publisher.py
          tests/test_snapshot_lineage.py
          tests/test_spine_access_candidate_preparation.py
      - run: uv run playwright install chromium
      - run: uv run pytest --browser -m browser tests/test_review_map_browser.py
      - run: uv build --no-sources

  portable-network-identifiers:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.11.32"
      - run: uv python install 3.12
      - run: uv sync --frozen --all-groups
      - run: >-
          uv run pytest
          tests/test_content_identity.py
          tests/test_backbone_assembly.py::test_cross_platform_identifier_and_provenance_fixture_is_exact

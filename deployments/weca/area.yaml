compilation:
  max_connection_km: 15
  criteria_version: "1"
  agent:
    provider: fake
    response_mode: direct-runtime
    review_statuses: [amber, red]
    max_requests: 1000
  network_selection:
    profile_id: weca-network-selection-v1
    candidate_source_precedence:
      - verified-existing-asset
      - a-road-corridor
      - b-road-corridor
      - other-routable
atm:
  enabled: false
  mode: blind
  redistribution_permitted: false
publication:
